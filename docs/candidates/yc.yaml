# Y Combinator companies, from the public yc-oss directory API
#   https://yc-oss.github.io/api  (no auth, refreshed daily)
#
# Why the directory and not the job site: workatastartup.com is a login-walled
# Inertia app. /jobs returns HTML carrying no job payload, an x-inertia request
# 409s, and /companies/fetch returns rendered fragments with no job links — so
# sweeping it means defeating a login wall. Most YC companies are on Greenhouse,
# Lever or Ashby, which the sweep already speaks, so the route in is this
# directory plus find-boards.mjs.
#
# Filter: top companies, plus companies the directory marks isHiring, still
# Active, US-located, from a 2024-or-later batch. Younger companies are the
# ones that actually post below Senior, which board-yield shows is the single
# best predictor of whether a board can yield anything at ~2.5 years.
