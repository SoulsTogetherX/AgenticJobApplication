# =============================================================================
# JOB SOURCES — the boards swept by `node scripts/find-jobs.mjs search`.
# User-editable: add a company without touching code.
#
# Types and required fields:
#   greenhouse | lever | ashby | workable | recruitee | smartrecruiters:
#     { type, slug, company }   (slug = the company's board identifier)
#   workday:
#     { type, company, host, tenant, site }
#     Find these in the careers URL: https://<tenant>.wdN.myworkdayjobs.com/<site>
#
# All endpoints used are public, no-auth JSON APIs intended for integration.
# Every entry below was verified working on 2026-07-27.
# =============================================================================

boards:
  # --- Tech (Greenhouse) ---
  - { type: greenhouse, slug: anthropic, company: Anthropic }
  - { type: greenhouse, slug: cloudflare, company: Cloudflare }
  - { type: greenhouse, slug: datadog, company: Datadog }
  - { type: greenhouse, slug: gitlab, company: GitLab }
  - { type: greenhouse, slug: mongodb, company: MongoDB }
  - { type: greenhouse, slug: reddit, company: Reddit }

  # --- Tech (Lever / Ashby) ---
  - { type: lever, slug: palantir, company: Palantir }
  - { type: ashby, slug: openai, company: OpenAI }
  - { type: ashby, slug: linear, company: Linear }
  - { type: ashby, slug: ramp, company: Ramp }

  # --- Fortune 500 (SmartRecruiters) ---
  - { type: smartrecruiters, slug: Visa, company: Visa }
  - { type: smartrecruiters, slug: McDonaldsCorporation, company: "McDonald's" }

  # --- Fortune 500 (Workday) ---
