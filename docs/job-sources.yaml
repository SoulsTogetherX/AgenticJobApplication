# =============================================================================
# JOB SOURCES — the boards swept by `node scripts/find-jobs.mjs search`.
#
# Manage this list with the manage-sources skill (or by hand):
#   node scripts/manage-sources.mjs add --type <ats> --slug <slug> --company "Name"
#   node scripts/manage-sources.mjs remove "<company or slug>"
#   node scripts/manage-sources.mjs verify
# `add` prescreens the board (live API check) and refuses duplicates.
#
# FORMAT RULE: one entry per line, flow style ({ ... }) — the add/remove
# tooling edits this file line-by-line to preserve these comments.
#
# Types and required fields:
#   greenhouse | lever | ashby | workable | recruitee | smartrecruiters:
#     { type, slug, company }
#   workday:
#     { type, company, host, tenant, site }
#     (from the careers URL: https://<tenant>.wdN.myworkdayjobs.com/<site>)
#
# The Adzuna aggregator is separate — it is credential-based (.env) and always
# included in `search --source all` when configured.
# =============================================================================

