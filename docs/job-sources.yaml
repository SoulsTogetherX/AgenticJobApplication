# =============================================================================
# JOB SOURCES — the boards swept by `node scripts/leads/find-jobs.mjs search`.
#
# Manage this list with the manage-sources skill (or by hand):
#   node scripts/leads/manage-sources.mjs add --type <ats> --slug <slug> --company "Name"
#   node scripts/leads/manage-sources.mjs remove "<company or slug>"
#   node scripts/leads/manage-sources.mjs verify
# `add` prescreens the board (live API check) and refuses duplicates.
#
# FORMAT RULE: one entry per line, flow style ({ ... }) — the add/remove
# tooling edits this file line-by-line to preserve these comments. Section
# comments are safe; a trailing comment on an entry line is not.
#
# Types and required fields:
#   greenhouse | lever | ashby | workable | recruitee | smartrecruiters:
#     { type, slug, company }
#   workday:
#     { type, company, host, tenant, site }
#     (from the careers URL: https://<tenant>.wdN.myworkdayjobs.com/<site>)
#   oracle_cloud:
#     { type, company, host, site }   — site is often the default "CX_1"
#   jobvite:        { type, slug, company }
#   successfactors: { type, company, host }
#
# The Adzuna aggregator is separate — it is credential-based (.env) and always
# included in `search --source all` when configured.
#
# -----------------------------------------------------------------------------
# YIELD, measured by `node scripts/leads/board-yield.mjs` on 2026-08-13:
# 44 boards, 8,867 live postings, 39 reachable (0.44%). 37 boards yielded ZERO.
# Of the 8,867: 4,819 failed the experience bar, 2,836 location, 1,024 title.
#
# Read that before adding anything: the constraint is not board COUNT, it is
# that most boards post senior roles. Every junk board costs sweep time forever
# and buries reachable leads in noise. Removing a zero-yield board is the
# user's call — board-yield.mjs reports and never edits.
#
# WORKDAY IS MEASURED DIFFERENTLY and this matters. It is the one fetcher of
# thirteen where the query is a SERVER-SIDE filter, so its "live" count is
# postings matching the query, not the whole board. Under the single query
# "full stack" the sweep saw 2 of Aristocrat's 178 postings and 0 of UNLV's
# 123. Set roles.search_query in docs/application-limits.yaml to a LIST to fix
# that — fetchBoard unions the results across a server-filtered board.
# =============================================================================

boards:
  # --- Las Vegas / Nevada -----------------------------------------------------
  # Local or Vegas-commutable employers. These exist to serve the on-site half
  # of the location rule; the remote sections below serve the other half.
  #
  # Southwest Gas measured 33.3% (2 of 6) on 2026-08-13 — the highest yield of
  # any board in this file, better than Render (17.1%) and Jobicy (16%).
  # UNLV and CSN are only visible with a query LIST (see the Workday note
  # above); under a single "full stack" query both read as live=0.
  # LVVWD yields 0 today for a DIFFERENT reason worth knowing: its Las Vegas
  # roles are located by building ("Molasky Corporate Center"), which the
  # location gate reads as a relocation, and titled "Applications Developer",
  # which roles.title_keywords does not carry. Both are config, not code.
  - { type: oracle_cloud, company: Southwest Gas, host: ebtw.fa.us2.oraclecloud.com, site: CX_1 }
  - { type: workday, company: UNLV (NSHE), host: nshe.wd1.myworkdayjobs.com, tenant: nshe, site: UNLV-External }
  - { type: workday, company: College of Southern Nevada, host: nshe.wd1.myworkdayjobs.com, tenant: nshe, site: CSN-External }
  - { type: workday, company: Las Vegas Valley Water District, host: lvvwd.wd1.myworkdayjobs.com, tenant: lvvwd, site: LVVWDWaterJobs }
  - { type: lever, slug: truezerotech, company: True Zero Technologies }
  - { type: lever, slug: allegiantair, company: Allegiant Travel }

  # --- Gaming, casino suppliers and betting -----------------------------------
