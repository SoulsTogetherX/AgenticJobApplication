  # --- remote-only aggregators ------------------------------------------------
  # Not a company board: the whole corpus is remote roles, so a posting's
  # location states who may be HIRED ("USA") rather than where an office is.
  # The fetchers set remote_source, which is what stops the location gate
  # reading "USA" as a relocation. Full descriptions arrive in the list
  # endpoint, so the body gate runs with no per-posting fetch.
  #
  # jobicy measured 16% on 2026-08-13 (8 of 50) — a better yield than every
  # company board here except Render. remotive and remoteok measured 0 and are
  # left commented out; uncomment to let board-yield judge them again.
  #
  # DO NOT ADD MORE GENERAL AGGREGATORS. Measured 2026-08-13 against this
  # repo's own atsIdentity(): Jobicy 0/50, Himalayas 0/20, WorkingNomads 0/50,
  # WeWorkRemotely 0/25, RemoteOK 0/100, Remotive 0/18, The Muse 0/20,
  # Arbeitnow 0/176 of their list URLs resolve to an employer ATS. They produce
  # MANUAL_ONLY leads by construction — prep-queue.mjs already records the same
  # thing from the other end (81 of 81 adzuna, 14 of 14 jobicy carry no
  # apply_url). More aggregator supply is more leads the trust gate must refuse.
  - { type: jobicy, company: Jobicy (remote US), geo: usa, industry: engineering }
  # - { type: remotive, company: "Remotive (remote)", category: software-dev }
  # - { type: remoteok, company: "RemoteOK (remote)" }
