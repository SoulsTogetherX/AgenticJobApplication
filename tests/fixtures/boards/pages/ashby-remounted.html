<!doctype html>
<html lang="en" data-aj-remounted="1">
  <head>
    <meta charset="utf-8" />
    <title>Fixture Analytics — Full-Stack Engineer</title>
  </head>
  <body>
    <!--
      Ashby replica, STEP 2: the form AFTER the resume-parse remount.

      pages/ashby.html is what the board serves first. ~700ms after a file is
      chosen, its own script replaces the form's innerHTML — and this file is
      what the DOM looks like once that has happened. server.mjs serves it for a
      POST (or ?step=2) to the SAME URL, exactly as it serves greenhouse-step2,
      because that is what a browser sees: one URL, two DOMs.

      WHY IT IS A FILE AND NOT AN ASSERTION ABOUT A TIMER.

      The remount is the worst latency case the runner will meet, and until now
      it was represented nowhere a test without a browser could reach it: the
      timer only fires in a real browser, so every no-browser leg measured the
      PRE-remount form and called it Ashby. With this file the post-remount
      state has a scan fixture (scans/ashby-step2.scan.json), so the re-scan and
      the re-fill that a remount forces can be planned and costed offline.

      THREE THINGS DIFFER FROM STEP 1, and each is the trait, not decoration:

      1. EVERY data-aj STAMP IS GONE. The scanner stamps elements so the filler
         can find them again; innerHTML replacement drops the attributes and
         mints new element identities. Every handle the filler holds is stale.
         This is why fill-engine.mjs's actOn/isStaleError retry exists, and why
         a live run once logged a field as failed whose value had landed.

      2. THE BOARD HAS WRITTEN VALUES THE AGENT DID NOT SUPPLY. Name, email and
         phone come back populated from the parse. They are the user's own
         details here — this is an HONEST replica, not an attack — but the
         provenance is the board's, so a filler that treats "already has a
         value" as "I filled this" is reading its own success off a third
         party's write. Note that the phone number is the one the PARSER
         produced, not necessarily the one in the fact base.

      3. THE STATUS NODE HAS CHANGED TEXT, which is the only visible signal that
         any of the above happened.

      What does NOT differ: the field set, the labels, the combobox markup and
      the CSP. A remount that also changed the questions would be a different
      test, and it would let a real bug hide behind an expected difference.
    -->
    <h1>Full-Stack Engineer</h1>
    <div id="root">
      <form
        id="application-form"
        method="post"
        action=""
        enctype="multipart/form-data"
      >
        <div class="ashby-application-form-field-entry">
          <label for="_systemfield_name"
            >Name<span aria-hidden="true">*</span></label
          >
          <input
            type="text"
            id="_systemfield_name"
            name="_systemfield_name"
            value="Fixture Applicant"
            required
          />
        </div>

        <div class="ashby-application-form-field-entry">
          <label for="_systemfield_email"
            >Email<span aria-hidden="true">*</span></label
          >
          <input
            type="email"
            id="_systemfield_email"
            name="_systemfield_email"
            value="applicant@fixture.test"
            required
          />
        </div>

        <div class="ashby-application-form-field-entry">
          <label for="_systemfield_phone">Phone</label>
          <input
            type="tel"
            id="_systemfield_phone"
            name="_systemfield_phone"
            value="702-555-0100"
          />
        </div>

        <div class="ashby-application-form-field-entry">
          <label for="_systemfield_resume"
            >Resume<span aria-hidden="true">*</span></label
          >
          <input
            type="file"
            id="_systemfield_resume"
            name="_systemfield_resume"
            accept=".pdf,.doc,.docx"
            required
          />
          <div id="autofill-status" role="status">
            Resume parsed — fields updated
          </div>
        </div>

        <div class="ashby-application-form-field-entry">
          <span id="loc-label" class="ashby-application-form-field-label"
            >Where are you located?<span aria-hidden="true">*</span></span
          >
          <div
            data-ui="select"
            role="combobox"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-labelledby="loc-label"
            aria-required="true"
            tabindex="0"
          >
            <span class="placeholder">Select a location</span>
          </div>
          <div class="menu" hidden>
            <div role="option" class="menu__option">Las Vegas, NV</div>
            <div role="option" class="menu__option">Remote (US)</div>
            <div role="option" class="menu__option">New York, NY</div>
          </div>
        </div>

        <div class="ashby-application-form-field-entry">
          <span id="yrs-label" class="ashby-application-form-field-label"
            >How many years of professional full-stack experience do you
            have?</span
          >
          <input
            type="number"
            id="yrs"
            name="yrs"
            aria-labelledby="yrs-label"
            min="0"
            max="50"
          />
        </div>

        <div class="ashby-application-form-field-entry">
          <span class="ashby-application-form-field-label">Cover letter</span>
          <div
            id="cover"
            contenteditable="true"
            aria-label="Cover letter"
            role="textbox"
          ></div>
        </div>

        <button type="submit" id="submit-application">
          Submit Application
        </button>
      </form>
    </div>

    <!--
      Re-armed after the re-render, the way a framework re-binds its handlers.
      A second upload remounts again — the hazard is not once-only.
    -->
    <script nonce="ajfixturenonce">
      ;(function () {
        var input = document.getElementById("_systemfield_resume")
        var status = document.getElementById("autofill-status")
        if (!input) return
        input.addEventListener("change", function () {
          status.textContent = "Parsing resume…"
          setTimeout(function () {
            var form = document.getElementById("application-form")
            if (!form) return
            var html = form.innerHTML
            form.innerHTML = html.replace(/ data-aj="[^"]*"/g, "")
            var s = document.getElementById("autofill-status")
            if (s) s.textContent = "Resume parsed — fields updated"
            document.documentElement.setAttribute("data-aj-remounted", "1")
          }, 700)
        })
      })()
    </script>

    <!--
      NO NONCE, same as step 1. Under the served CSP a browser refuses to run
      it, so window.__ajCspProof stays undefined. The remount must not be a hole
      in the policy: a page that relaxed its CSP on step 2 would let the
      bootstrap's banned addScriptTag path start working again, intermittently.
    -->
    <script>
      window.__ajCspProof =
        "inline script ran WITHOUT a nonce — CSP not enforced"
    </script>
  </body>
</html>
