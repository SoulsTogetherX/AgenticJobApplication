<!-- FIXTURE PAGE — THE CONTROL, and the most important file in this directory.

     A classifier tested only on pages it is meant to recognise recognises
     everything. This page is warm, thanks the reader, mentions their interest
     and their application, and is NOT an application receipt: it is the
     marketing page a board shows when a submit silently did nothing.

     The corpus test asserts this comes back `unclassified`, which is a hard
     STOP — the correct outcome for a page nothing understood. If a rule change
     ever makes this read as `confirmation`, that rule would record an
     application that was never sent. -->
