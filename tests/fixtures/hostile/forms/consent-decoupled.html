<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture Legal Services — Full-Stack Engineer</title>
  </head>
  <body>
    <!--
      THE TWO CONSENT HOLES FROM COMMIT 5a1d8b2. Fixture; exists to be blocked.

      Both are reasons `fill-plan.mjs` requires the scanner to positively assert
      `labelExact` before ANY consent box can auto-tick — and why, since
      scan-page.js does not set it, nothing auto-ticks today.

      HOLE 1 — DECOUPLING (#consent-decoupled)
        scan-page.js's labelOf() reads aria-labelledby, then aria-label, and
        only then a visible <label>. So a page controls the MATCHED string and
        the DISPLAYED string independently:
          matched:   "I certify the information in this application is accurate."
          displayed: "I agree to binding arbitration ... waive ... jury trial."
        The allowlist hits the innocuous text, the box ticks, and the approval
        message shows the innocuous text too. An irreversible legal waiver,
        ticked, invisible in review.

      HOLE 2 — TRUNCATION (#consent-long-approved / #consent-long-arbitration)
        txt() slices every label to 120 characters. These two labels are
        IDENTICAL for their first 120 characters and diverge only after that:
        one is the certification the user approved, the other appends
        " I also agree to binding arbitration." Both normalise to the same
        matched string. Nothing the user sees changes.

      HOLE 3 — THE PATTERN LIST (#consent-reworded)
        isHardConsent is a regex list, so it is defeated by rewording:
        "binding dispute resolution", "background investigation", "adopt this
        document electronically" all pass it. This is the 26th-rewording case:
        a pattern addition here is not a structural fix.

      Every label below is on ONE source line on purpose. scan-page.js's txt()
      collapses whitespace before slicing, so a reflowed label would still
      normalise identically — but keeping them on one line makes the 120-char
      collision readable to a human reviewing this file.
    -->
    <h1>Full-Stack Engineer</h1>
    <form id="application-form" method="post" action="">
      <div class="field">
        <label for="f-name">Full name</label>
        <input type="text" id="f-name" name="name" />
      </div>

      <!-- HOLE 1: what is matched and what is shown are two different strings. -->
      <div class="field">
        <input
          type="checkbox"
          id="consent-decoupled"
          name="consent_decoupled"
          aria-label="I certify the information in this application is accurate."
        />
        <span id="consent-decoupled-visible"
          >I agree to binding arbitration of all disputes arising from my
          employment and waive my right to a jury trial.</span
        >
      </div>

      <!-- HOLE 2a: the wording the user approved. Over 120 characters. -->
      <div class="field">
        <label for="consent-long-approved"
          >I certify that all information provided in this application is true,
          complete and accurate to the best of my knowledge and belief.</label
        >
        <input
          type="checkbox"
          id="consent-long-approved"
          name="consent_long_approved"
        />
      </div>

      <!-- HOLE 2b: identical for 120 characters, then a legal waiver. -->
      <div class="field">
        <label for="consent-long-arbitration"
          >I certify that all information provided in this application is true,
          complete and accurate to the best of my knowledge and belief. I also
          agree to binding arbitration and waive a jury trial.</label
        >
        <input
          type="checkbox"
          id="consent-long-arbitration"
          name="consent_long_arbitration"
        />
      </div>

      <!-- HOLE 3: the same three legal acts, none of them matching the pattern list. -->
      <div class="field">
        <label for="consent-reworded"
          >I accept binding dispute resolution, authorise a background
          investigation, and adopt this document electronically.</label
        >
        <input type="checkbox" id="consent-reworded" name="consent_reworded" />
      </div>

      <button type="submit" id="submit-application">Submit Application</button>
    </form>
  </body>
</html>
